name: Self Reservation Monitor

on:
  workflow_dispatch: # دکمه اجرای دستی برای هر زمان که خودتان بخواهید استارت بزنید
  schedule:
    # اجرای خودکار هر ۶ ساعت یک‌بار (برای تمدید خودکار بعد از اتمام محدودیت ۶ ساعته گیت‌هاب)
    - cron: '0 */6 * * *'

# جلوگیری از اجرای همزمان دو ربات (اگر ربات جدید شروع شود، قبلی را متوقف می‌کند)
concurrency:
  group: self-bot-group
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # تنظیم سقف ۶ ساعت (۳۶۰ دقیقه) برای هر بار اجرا
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install selenium requests

      - name: Run Bot
        run: python bot.py
